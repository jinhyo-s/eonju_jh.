<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수행평가 알리미</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
        
        :root {
            --navy: #1A2980;
            --navy-dark: #0f184d; /* 버튼 그림자용 어두운 남색 */
            --teal: #008080;
            --teal-dark: #005959; /* 버튼 그림자용 어두운 청록색 */
            --white: #FFFFFF;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--white);
            color: var(--navy);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            align-items: center; 
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            color: var(--navy);
            margin-bottom: 10px;
        }
        p.desc {
            text-align: center;
            color: var(--teal);
            margin-bottom: 30px;
            font-size: 15px;
        }
        .step {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .step.active {
            display: block;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            color: var(--navy);
        }
        input, select {
            width: 100%;
            padding: 10px 5px;
            margin-bottom: 15px;
            border: none;
            border-bottom: 2px solid var(--teal); 
            background: transparent;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 16px;
            color: var(--navy);
            transition: 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-bottom: 2px solid var(--navy);
        }

        /* 입체적인 3D 버튼 디자인 */
        .btn {
            background-color: var(--navy);
            color: var(--white);
            border: none;
            padding: 15px 20px;
            border-radius: 8px; 
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            
            /* 입체 효과 (그림자) */
            box-shadow: 0 5px 0 var(--navy-dark);
            transition: all 0.1s ease; /* 누를 때 빠른 반응 속도 */
            position: relative;
        }
        /* 버튼을 눌렀을 때 효과 */
        .btn:active {
            box-shadow: 0 0 0 var(--navy-dark); /* 그림자 사라짐 */
            transform: translateY(5px); /* 아래로 5px 눌림 */
        }
        
        .btn-outline {
            background-color: var(--white);
            color: var(--teal);
            border: 2px solid var(--teal);
            
            /* 외곽선 버튼 입체 효과 */
            box-shadow: 0 5px 0 var(--teal-dark);
        }
        .btn-outline:active {
            box-shadow: 0 0 0 var(--teal-dark);
            transform: translateY(5px);
        }

        #step0 { text-align: center; }
        #step0 h1 { font-size: 40px; margin-bottom: 5px; }

        .card {
            border: 1px solid var(--teal);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            background-color: var(--white);
        }
        .card h3 { margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .card.completed {
            opacity: 0.5;
            text-decoration: line-through;
            border-color: #ccc;
        }
        .timer {
            font-size: 24px; /* 타이머 크기 키움 */
            font-weight: bold;
            color: var(--navy);
            margin: 15px 0;
            text-align: center;
        }
        .motivation {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            color: var(--teal);
            margin-bottom: 10px;
        }

        .tabs { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-bottom: 2px solid #ccc; font-weight: bold; color: #999;}
        .tab.active { border-bottom: 2px solid var(--navy); color: var(--navy); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 단계 0: 시작 화면 -->
    <div id="step0" class="step">
        <h1>수행평가 알리미</h1>
        <p class="desc">잊지 말고 꼼꼼하게, 완벽한 수행평가 준비</p>
        <button class="btn" style="padding: 18px; font-size: 18px; margin-top: 20px;" onclick="startApp()">시작하기</button>
    </div>

    <!-- 단계 1: 날짜/교시 입력 -->
    <div id="step1" class="step">
        <h2>수행평가 등록</h2>
        <p class="desc">일정과 과목을 입력해주세요.</p>
        <div id="step1-container"></div>
        <button class="btn btn-outline" onclick="addSubjectInput()">+ 과목 추가</button>
        <button class="btn" onclick="goToStep2()">다음</button>
    </div>

    <!-- 단계 2: 준비물 입력 -->
    <div id="step2" class="step">
        <h2>준비물 확인</h2>
        <p class="desc">필요한 준비물이 있다면 적어주세요.</p>
        <div id="step2-container"></div>
        <button class="btn" onclick="goToStep3()">다음</button>
    </div>

    <!-- 단계 3: 자신감 입력 -->
    <div id="step3" class="step">
        <h2>자신감 체크</h2>
        <p class="desc">1점(부족)부터 10점(완벽)까지 입력해주세요.</p>
        <div id="step3-container"></div>
        <button class="btn" onclick="finishSetup()">저장 및 완료</button>
    </div>

    <!-- 대시보드 (목록 화면) -->
    <div id="dashboard" class="step">
        <h2>내 수행평가</h2>
        <p class="desc">실시간 남은 시간 확인하기</p>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('pending')">진행 중</div>
            <div class="tab" onclick="switchTab('completed')">완료됨</div>
        </div>
        <div id="list-container"></div>
        <button class="btn btn-outline" style="margin-top:20px;" onclick="goToStep1()">+ 새 수행평가 등록</button>
    </div>
</div>

<script>
    let tempData = []; 
    let assessments = JSON.parse(localStorage.getItem('assessments')) || [];

    // 교시별 정확한 시작 시간 세팅
    const periodTimes = {
        "1": "08:50",
        "2": "09:45",
        "3": "10:40",
        "4": "11:35",
        "5": "13:20",
        "6": "14:15",
        "7": "15:10"
    };

    if (Notification.permission !== "granted") Notification.requestPermission();

    window.onload = () => {
        showStep('step0');
        setInterval(updateTimers, 1000); 
        checkNotifications(); 
    };

    function showStep(stepId) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function startApp() {
        if(assessments.length > 0) showDashboard();
        else goToStep1();
    }

    function goToStep1() {
        tempData = [];
        document.getElementById('step1-container').innerHTML = '';
        addSubjectInput();
        showStep('step1');
    }

    function addSubjectInput() {
        const id = Date.now();
        const html = `
            <div class="input-group" id="group-${id}">
                <label>과목명</label>
                <input type="text" class="sub-name" placeholder="국어, 수학 등">
                <label>날짜</label>
                <input type="date" class="sub-date">
                <label>교시</label>
                <select class="sub-period">
                    <option value="1">1교시 (08:50)</option>
                    <option value="2">2교시 (09:45)</option>
                    <option value="3">3교시 (10:40)</option>
                    <option value="4">4교시 (11:35)</option>
                    <option value="5">5교시 (13:20)</option>
                    <option value="6">6교시 (14:15)</option>
                    <option value="7">7교시 (15:10)</option>
                </select>
            </div>
            <hr style="border:0; border-top:1px dashed #ccc; margin-bottom:25px;">
        `;
        document.getElementById('step1-container').insertAdjacentHTML('beforeend', html);
    }

    function goToStep2() {
        const groups = document.querySelectorAll('#step1-container .input-group');
        tempData = [];
        let valid = true;

        groups.forEach(group => {
            const name = group.querySelector('.sub-name').value;
            const date = group.querySelector('.sub-date').value;
            const period = group.querySelector('.sub-period').value;
            
            if(!name || !date) valid = false;
            
            tempData.push({ id: Date.now() + Math.random(), name, date, period, materials: '', confidence: 5, completed: false, notified3: false, notified1: false });
        });

        if(!valid) return alert("과목명과 날짜를 입력해주세요.");

        let html = '';
        tempData.forEach((item, index) => {
            html += `
                <div class="input-group">
                    <label>[${item.name}] 준비물</label>
                    <input type="text" id="mat-${index}" placeholder="예: 교과서, 프린트물">
                </div>
            `;
        });
        document.getElementById('step2-container').innerHTML = html;
        showStep('step2');
    }

    function goToStep3() {
        tempData.forEach((item, index) => {
            item.materials = document.getElementById(`mat-${index}`).value || '없음';
        });

        let html = '';
        tempData.forEach((item, index) => {
            html += `
                <div class="input-group">
                    <label>[${item.name}] 자신감</label>
                    <input type="number" id="conf-${index}" min="1" max="10" value="5">
                </div>
            `;
        });
        document.getElementById('step3-container').innerHTML = html;
        showStep('step3');
    }

    function finishSetup() {
        tempData.forEach((item, index) => {
            item.confidence = parseInt(document.getElementById(`conf-${index}`).value);
        });

        assessments = [...assessments, ...tempData];
        saveData();
        showDashboard();
    }

    let currentTab = 'pending';
    function showDashboard() {
        showStep('dashboard');
        renderList();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        event.target.classList.add('active');
        renderList();
    }

    function renderList() {
        const container = document.getElementById('list-container');
        container.innerHTML = '';

        const filtered = assessments.filter(a => currentTab === 'pending' ? !a.completed : a.completed);

        if(filtered.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#999; margin-top:30px;">등록된 수행평가가 없습니다.</p>`;
            return;
        }

        filtered.forEach(item => {
            let motText = '차근차근 준비하면 충분해요.';
            if(item.confidence <= 3) motText = '발등에 불 떨어졌어요! 당장 시작하세요!';
            else if (item.confidence >= 8) motText = '여유롭네요. 한 번 쓱 훑어보고 만점 받으세요!';

            container.innerHTML += `
                <div class="card ${item.completed ? 'completed' : ''}">
                    <h3>${item.name} <span style="font-size:14px; color:var(--teal);">(${item.date} / ${item.period}교시)</span></h3>
                    <p style="margin: 5px 0;"><strong>준비물:</strong> ${item.materials}</p>
                    <div class="motivation">${motText}</div>
                    ${!item.completed ? `<div class="timer" id="timer-${item.id}">계산 중...</div>` : ''}
                    ${!item.completed ? `<button class="btn" onclick="completeTask('${item.id}')">완료하기</button>` : `<button class="btn btn-outline" onclick="deleteTask('${item.id}')">삭제하기</button>`}
                </div>
            `;
        });
        updateTimers();
    }

    function completeTask(id) {
        const index = assessments.findIndex(a => a.id == id);
        if(index > -1) {
            assessments[index].completed = true;
            saveData();
            renderList();
        }
    }

    function deleteTask(id) {
        assessments = assessments.filter(a => a.id != id);
        saveData();
        renderList();
    }

    function saveData() {
        localStorage.setItem('assessments', JSON.stringify(assessments));
    }

    function updateTimers() {
        if(document.getElementById('dashboard').classList.contains('active') && currentTab === 'pending') {
            assessments.forEach(item => {
                if(!item.completed) {
                    const timerEl = document.getElementById(`timer-${item.id}`);
                    if(timerEl) {
                        const now = new Date().getTime();
                        
                        // 날짜 + 해당 교시의 정확한 시작 시간을 합쳐서 계산
                        const targetTimeStr = periodTimes[item.period];
                        const target = new Date(`${item.date}T${targetTimeStr}:00`).getTime();
                        
                        const distance = target - now;

                        if (distance < 0) {
                            timerEl.innerHTML = "수행평가 종료됨";
                        } else {
                            // 🚀 D-day 없이 '총 시간(24시간 초과 가능) + 분 + 초' 로 표시
                            const hours = Math.floor(distance / (1000 * 60 * 60));
                            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                            
                            timerEl.innerHTML = `${hours}시간 ${minutes}분 ${seconds}초 남음`;
                        }
                    }
                }
            });
        }
    }

    function checkNotifications() {
        setInterval(() => {
            const now = new Date().getTime();
            assessments.forEach(item => {
                if(!item.completed) {
                    const targetTimeStr = periodTimes[item.period];
                    const target = new Date(`${item.date}T${targetTimeStr}:00`).getTime();
                    
                    const distance = target - now;
                    const daysLeft = distance / (1000 * 60 * 60 * 24);

                    if (daysLeft <= 3 && daysLeft > 2 && !item.notified3) {
                        sendPushNotification("수행평가 D-3", `${item.name} 수행평가가 3일 남았습니다. 시작하세요!`);
                        item.notified3 = true;
                        saveData();
                    }
                    if (daysLeft <= 1 && daysLeft > 0 && !item.notified1) {
                        sendPushNotification("수행평가 D-1", `${item.name} 수행평가가 내일입니다. 준비물(${item.materials}) 확인하세요.`);
                        item.notified1 = true;
                        saveData();
                    }
                }
            });
        }, 60000); 
    }

    function sendPushNotification(title, body) {
        if (Notification.permission === "granted") {
            new Notification(title, { body: body });
        }
    }
</script>
</body>
</html>
